name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: Win32
          - arch: x64
            platform: x64
    steps:
      # Full history for git describe, which sets the version resource.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: |
          cmake -S . -B build -A ${{ matrix.platform }}
          cmake --build build --config Release

      # Unsigned, see .github/SIGNING.md.
      - uses: actions/upload-artifact@v7
        with:
          name: keypop-${{ matrix.arch }}
          path: |
            build/Release/keypop.exe
            build/Release/keypop.pdb
